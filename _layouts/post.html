---
layout: default
---
<article class="post">
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {%- if page.reading_time %} · {{ page.reading_time }} min read{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
