<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the saved theme before first paint to avoid a flash. Dark is the default.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <main class="window">
    <header class="window-bar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="window-title">pawel@blog ~ zsh</span>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
        theme: <span data-theme-label>dark</span>
      </button>
    </header>

    <nav class="prompt-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}">~/home</a>
      <a href="{{ site.github_url }}" rel="me noopener" target="_blank">github</a>
      <a href="{{ site.linkedin_url }}" rel="me noopener" target="_blank">linkedin</a>
    </nav>

    <div class="window-body">
      {{ content }}
    </div>
  </main>

  <footer>© {{ 'now' | date: '%Y' }} {{ site.author }}</footer>
</body>
</html>
